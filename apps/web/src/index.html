<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8" />
        <title>ALMOGHANI IPTV | المغني</title>
        <base href="/" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src https://www.youtube-nocookie.com; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' http: https: file: data: blob:; font-src 'self' data:; media-src 'self' http: https: file: data: blob:; connect-src 'self' http: https: ws: wss: blob: data:; worker-src 'self' blob:"
        />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="ALMOGHANI IPTV" />
        <meta property="og:url" content="https://almoghani.net/" />
        <meta
            property="og:image"
            content="https://raw.githubusercontent.com/4gray/iptvnator/electron/iptv-dark-theme.png"
        />
        <meta
            property="og:description"
            content="ALMOGHANI IPTV — مشغل قوائم البث المباشر M3U وM3U8"
        />
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
        <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico" />
        <script src="assets/app-config.js" defer></script>
        <style>
            /* Asset-free splash while bundles load; main.ts removes it after bootstrap. */
            #initial-splash {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
                background: radial-gradient(circle at 50% 20%, #29231a, #08090d 68%);
                color: #e9c77a;
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                    'Helvetica Neue', Arial, sans-serif;
                z-index: 99999;
            }
            #initial-splash .splash-mark {
                font-size: 18px;
                font-weight: 600;
                letter-spacing: 0.04em;
                opacity: 0.85;
            }
            #initial-splash .splash-spinner {
                width: 28px;
                height: 28px;
                border: 3px solid rgba(255, 255, 255, 0.12);
                border-top-color: #e9c77a;
                border-radius: 50%;
                animation: initial-splash-spin 0.9s linear infinite;
            }
            @keyframes initial-splash-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #initial-splash .splash-spinner {
                    animation: none;
                    opacity: 0.6;
                }
            }
        </style>
    </head>
    <body class="mat-app-background">
        <div id="initial-splash" role="status" aria-label="جارٍ تحميل ALMOGHANI IPTV">
            <span class="splash-mark">ALMOGHANI IPTV</span>
            <span class="splash-spinner" aria-hidden="true"></span>
        </div>
        <app-root></app-root>
    </body>
</html>
